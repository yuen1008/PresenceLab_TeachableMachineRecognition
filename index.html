<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Classifier</title>
    <style>
      :root {
        --accent: #ff4d6d;
        --ink: #101014;
        --paper: #f4f2ed;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        background: var(--accent);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
        transition: background-color 0.35s ease;
      }
      .background-type {
        position: fixed;
        inset: -12vh -12vw;
        z-index: 0;
        display: grid;
        align-content: space-around;
        gap: 1vh;
        overflow: hidden;
        pointer-events: none;
        opacity: 0.98;
        transform: rotate(-8deg) scale(1.12);
      }
      .ticker {
        width: max-content;
        display: flex;
        white-space: nowrap;
        font-size: clamp(4rem, 12vw, 14rem);
        font-weight: 900;
        letter-spacing: -0.08em;
        line-height: 0.77;
        text-transform: uppercase;
        color: #fff;
        animation: scroll-left 17s linear infinite;
      }
      .ticker:nth-child(even) {
        animation-name: scroll-right;
        animation-duration: 21s;
      }
      .ticker span {
        padding-right: 0.34em;
      }
      @keyframes scroll-left {
        to {
          transform: translateX(-33.33%);
        }
      }
      @keyframes scroll-right {
        from {
          transform: translateX(-33.33%);
        }
        to {
          transform: translateX(0);
        }
      }
      main {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      .viewer {
        width: min(84vw, 440px);
        text-align: center;
      }
      .heading {
        margin: 0 0 1rem;
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      #webcam-container {
        aspect-ratio: 1;
        overflow: hidden;
        border: 8px solid #fff;
        background: #111;
        box-shadow: 12px 12px 0 var(--ink);
      }
      #webcam-container canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        object-fit: cover;
      }
      button {
        margin-top: 1.25rem;
        border: 0;
        padding: 0.85rem 1.25rem;
        background: var(--ink);
        color: white;
        font: inherit;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        cursor: pointer;
      }
      button:hover {
        background: var(--accent);
      }
      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }
      #label-container {
        display: grid;
        gap: 0.25rem;
        margin-top: 1rem;
        font-size: 0.78rem;
        font-weight: 700;
        line-height: 1.3;
      }
      #label-container div:first-child {
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <div class="background-type" id="background-type" aria-hidden="true"></div>
    <main>
      <section class="viewer" aria-label="Live image classifier">
        <p class="heading">Live image classifier</p>
        <div id="webcam-container"></div>
        <button id="start-button" type="button" onclick="init()">
          Start camera
        </button>
        <div id="label-container" aria-live="polite"></div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script type="text/javascript">
      // More API functions here:
      // https://github.com/googlecreativelab/teachablemachine-community/tree/master/libraries/image

      // the link to your model provided by Teachable Machine export panel
      const URL = "./tm-my-image-model/";

      const colors = [
        "#ff4d6d",
        "#2251ff",
        "#00a878",
        "#f08a00",
        "#8d3dff",
        "#e634a6",
      ];
      let model,
        webcam,
        labelContainer,
        maxPredictions,
        started = false,
        lastWinner = "";

      function setBackground(label, color) {
        document.documentElement.style.setProperty("--accent", color);
        const repeated = Array(10).fill(`<span>${label}</span>`).join("");
        document.getElementById("background-type").innerHTML = Array(7)
          .fill(`<div class="ticker">${repeated}</div>`)
          .join("");
      }

      // Load the image model and setup the webcam
      async function init() {
        if (started) return;
        const button = document.getElementById("start-button");
        button.disabled = true;
        button.textContent = "Loading...";
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        // load the model and metadata
        // Refer to tmImage.loadFromFiles() in the API to support files from a file picker
        // or files from your local hard drive
        // Note: the pose library adds "tmImage" object to your window (window.tmImage)
        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        // Convenience function to setup a webcam
        const flip = true; // whether to flip the webcam
        webcam = new tmImage.Webcam(400, 400, flip); // width, height, flip
        await webcam.setup(); // request access to the webcam
        await webcam.play();
        window.requestAnimationFrame(loop);

        // append elements to the DOM
        document.getElementById("webcam-container").appendChild(webcam.canvas);
        labelContainer = document.getElementById("label-container");
        for (let i = 0; i < maxPredictions; i++) {
          // and class labels
          const item = document.createElement("div");
          item.style.color = colors[i % colors.length];
          labelContainer.appendChild(item);
        }
        started = true;
        button.textContent = "Camera live";
        setBackground("ready", colors[0]);
      }

      async function loop() {
        webcam.update(); // update the webcam frame
        await predict();
        window.requestAnimationFrame(loop);
      }

      // run the webcam image through the image model
      async function predict() {
        // predict can take in an image, video or canvas html element
        const prediction = await model.predict(webcam.canvas);
        let winner = prediction[0];
        for (let i = 0; i < maxPredictions; i++) {
          const classPrediction =
            prediction[i].className +
            ": " +
            prediction[i].probability.toFixed(2);
          labelContainer.childNodes[i].innerHTML = classPrediction;
          if (prediction[i].probability > winner.probability)
            winner = prediction[i];
        }
        const winnerIndex = prediction.indexOf(winner);
        const winnerKey = `${winner.className}-${winnerIndex}`;
        if (winnerKey !== lastWinner) {
          setBackground(winner.className, colors[winnerIndex % colors.length]);
          lastWinner = winnerKey;
        }
      }
    </script>
  </body>
</html>
